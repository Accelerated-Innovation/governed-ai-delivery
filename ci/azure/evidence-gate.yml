# Azure DevOps mirror of ci/github/evidence-gate.yml.
#
# PURPOSE: Gate merge on measured quality evidence rather than on scores the
#          authoring agent predicted for itself.
#
# A FIRST or Virtue score in plan.md is written by the agent that did the work.
# docs/<area>/evaluation/EVIDENCE_CONTRACT.md names that a producer self-check
# and makes it advisory: "the task owner never commits its own final gate."
#
# THIS GATE FAILS UNTIL YOU CONFIGURE IT — deliberately, and unlike every other
#   opt-in gate govkit ships. A gate that measured nothing has not passed.
#
# CONFIGURE THIS: replace the "Run tests and produce evidence" step with your
#   own test command, emitting JUnit XML (and, for UI, axe JSON). Anything you
#   do not emit reports INCONCLUSIVE, which is not a pass.
#   A test run with skipped tests also reports INCONCLUSIVE: a skipped test
#   did not run.
#
# FEATURES THE CHANGE TOUCHES:
#   After the tests, `govkit evidence --record` ties the result files to this
#   commit and working tree. `govkit evidence --changed-since <base>` then
#   reports every features/<name>/ directory with a changed file: each scenario
#   in its acceptance.feature against the test bound to it, and each criterion
#   in its eval_criteria.yaml against its measured score. Anything but a pass
#   fails the job. A change that touches no feature directory judges none.
#   - Scenario binding is verified with pytest-bdd only. See
#     docs/EVIDENCE_REPORT.md before relying on another runner.
#   - If your JUnit XML is not named junit*.xml, add --junit PATTERN to the
#     record step.
#   - A feature the change does not touch is not judged here.
#   - This gate does not check the change itself (a weakened scenario or test).
#     `govkit conform --feature` does; see docs/CHANGE_CONFORMANCE.md.
trigger: none

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Evidence
    displayName: Measured quality evidence
    jobs:
      - job: EvidenceCheck
        displayName: Measured quality evidence
        steps:
          - checkout: self
            # The base commit must be present to find the features a change touches.
            fetchDepth: 0

          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'
            displayName: Set up Python

          - script: pip install govkit~=0.23.0
            displayName: Install GovKit

          # CONFIGURE THIS — replace with your own test command.
          # It must leave JUnit XML (and, for UI, axe JSON) in the workspace.
          - script: |
              echo "Not configured: this gate has no test command yet."
              echo ""
              echo "Replace this step with your test run, emitting JUnit XML, e.g.:"
              echo "  pytest --junitxml=junit.xml"
              echo "  npx vitest run --reporter=junit --outputFile=junit.xml"
              echo ""
              echo "govkit evidence will now report every dimension as INCONCLUSIVE"
              echo "and fail, because a gate that measured nothing has not passed."
            displayName: Run tests and produce evidence

          - script: govkit evidence --target .
            displayName: Report measured evidence

          # Straight after the tests: ties the result files to this commit and tree.
          - script: govkit evidence --record --target .
            condition: succeededOrFailed()
            displayName: Record the results

          - bash: |
              BASE="origin/${TARGET_BRANCH}"
              if [ -z "${TARGET_BRANCH}" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
                echo "The target branch is not available; comparing with the previous commit."
                BASE=HEAD~1
              fi
              report="${AGENT_TEMPDIRECTORY}/evidence-features.md"
              raw="${AGENT_TEMPDIRECTORY}/evidence-features.txt"
              set +e
              govkit evidence --target . --changed-since "$BASE" | tee "$raw"
              status=${PIPESTATUS[0]}
              set -e
              {
                echo '```'
                sed 's/\x1b\[[0-9;]*m//g' "$raw"
                echo '```'
              } > "$report"
              echo "##vso[task.uploadsummary]$report"
              exit "$status"
            condition: succeededOrFailed()
            displayName: Report the features this change touches
            env:
              TARGET_BRANCH: $(System.PullRequest.TargetBranchName)

          - publish: $(System.DefaultWorkingDirectory)
            artifact: quality-evidence
            condition: always()
            displayName: Upload evidence artifacts
