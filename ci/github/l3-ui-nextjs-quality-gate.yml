# Level 3 Next.js App Router quality gate. No per-feature artifact checks.
name: Next.js UI Quality Gate (L3 Foundations)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.9'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install GovKit
        run: pip install govkit~=0.20.0

      - name: Enforce API and database boundary
        run: govkit doctor --target .

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm run test:ci --if-present

      - name: Production build
        run: npm run build
