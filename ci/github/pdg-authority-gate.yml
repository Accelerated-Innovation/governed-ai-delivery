# pdg-authority-gate.yml
#
# PURPOSE: Refuse to merge behavior the PDG does not currently authorize.
#
# JOBS:
#   pdg-authority — ask the PDG whether the commitment this baseline names
#                   still authorizes work, and fail closed if it does not or
#                   if the answer cannot be obtained
#
# WHY MERGE AND NOT THE START OF WORK:
#   Four placements were weighed. The start of work is the earliest and the
#   cheapest — and it is not enforceable: there is no chokepoint at the moment
#   someone starts typing, and an agent or a person can simply proceed. A PDG
#   outage there would also stop all new work rather than one merge.
#
#   Merge is a real chokepoint, through branch protection. An outage pauses
#   merges while everything else continues. And it is the only placement that
#   sees an invalidation which happened *after* the work began: authority
#   checked on Monday and withdrawn on Wednesday passes a Monday check forever.
#
#   The advisory half still exists and belongs at the start of work — run the
#   same command without `--enforce` and it reports "authorization unverified"
#   without blocking anyone.
#
# WHAT IT CHECKS:
#   `govkit verify-contract` asks both questions about EVERY commitment in
#   the repository — `commitments/<key>/baseline.json`, the layout the
#   baseline schema defines — rather than one path a variable points at:
#
#     drift      does the working tree still say what was approved? Local,
#                deterministic, no network.
#     authority  does the PDG still say that approval authorizes work?
#                Remote, current, and the only one that can see an
#                invalidation.
#
#   Neither substitutes for the other, and checking every package is what
#   makes a code change whose contract files were untouched still subject to
#   the gate. A pull request author's declaration that a change is internal
#   is not evidence.
#
# WHY `--require-authority`:
#   Without it the gate reads its own applicability out of the tree it is
#   gating. A pull request that removes `authority.source` from
#   `.govkit/marker.json` would turn the check into "not applicable" and exit
#   zero. This flag makes the *workflow* assert the expectation, so disabling
#   the gate means editing the gate.
#
# WHY `pull_request_target` AND NOT `pull_request`:
#   `pull_request` runs the workflow definition *from the branch being
#   gated*, with repository secrets, for anyone who can push a branch. The
#   flags below would then protect nothing: delete them, or add one step that
#   posts GOVKIT_PDG_TOKEN elsewhere. A chokepoint editable by the thing
#   passing through it is not a chokepoint.
#
#   `pull_request_target` takes the definition from the base branch — the one
#   branch protection already guards — and checks out the pull request's
#   merge ref as *data*.
#
#   THE RULE THAT MAKES THIS SAFE: this job reads the checked-out tree and
#   executes nothing from it. One pinned install from PyPI, one govkit
#   invocation. Do not add an editable install, a requirements file, a build
#   script or a task runner here — each would hand the credential to code the
#   pull request authored. A test enforces this.
#
# FORK PULL REQUESTS:
#   `pull_request_target` supplies secrets to fork pull requests too, so this
#   gate works for external contributions rather than failing closed on every
#   one of them. That is the reason it can be a required check without making
#   fork contributions unmergeable — and the reason the no-execution rule
#   above is not advice.
#
# WHY THE ENDPOINT IS A SECRET AND NOT A REPOSITORY SETTING:
#   An endpoint read from the working tree, paired with a credential from the
#   environment, is a token-exfiltration primitive: a pull request points at
#   an attacker-controlled host and collects the bearer token when this job
#   runs. The endpoint and the credential travel together, from the secret
#   store.
#
# WHY `--base-ref`:
#   Discovery reads the tree the pull request proposes, which is exactly what
#   the pull request controls. Deleting `commitments/foo/` removes foo from
#   the gate, and while any other package survives, "at least one commitment"
#   is still satisfied. With the base ref the check sees the deletion and
#   refuses it unless the PDG says that commitment no longer authorizes work
#   — retirement by invalidation, not by `rm`.
#
# CONFIGURE THIS:
#   1. Set repository secrets GOVKIT_PDG_URL and GOVKIT_PDG_TOKEN. The token
#      must be READ-ONLY: installing a checker must not confer authority to
#      make an approval.
#   2. Nothing else. Commitments are discovered, not configured — a path in a
#      required check is a path somebody has to remember to update.
#   3. Add `pdg-authority` to your branch protection required checks.
#   4. This file must be on the base branch to run at all — that is what
#      `pull_request_target` means, and it is the property being relied on.
#
#   Until GOVKIT_PDG_URL is set this job FAILS CLOSED on every pull request.
#   That is deliberate: a gate that passes because it was never configured is
#   indistinguishable from one that passed because the behavior was approved.
#
# NOT APPLICABLE IF YOU HAVE NO PDG:
#   GovKit is open source and most projects using it have no PDG at all. Do
#   not install this gate; `.govkit/marker.json` leaves `authority` absent and
#   `govkit validate-baseline` remains fully useful on its own.

name: PDG authority gate

on:
  pull_request_target:
    branches: [main]

permissions:
  contents: read

jobs:
  pdg-authority:
    name: pdg-authority
    runs-on: ubuntu-latest
    steps:
      # The merge ref, because the baseline being gated is the one the pull
      # request proposes — `pull_request_target` checks out the base by
      # default, which would verify the wrong tree. `persist-credentials:
      # false` because this event's token is write-scoped and must not be
      # left in .git/config beside untrusted content.
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          persist-credentials: false
          # The base branch has to be in the clone for --base-ref to resolve.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install govkit
        run: pip install govkit~=0.21.0

      - name: Verify every commitment is undrifted and currently authorized
        env:
          GOVKIT_PDG_URL: ${{ secrets.GOVKIT_PDG_URL }}
          GOVKIT_PDG_TOKEN: ${{ secrets.GOVKIT_PDG_TOKEN }}
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          govkit verify-contract \
            --target . \
            --base-ref "$BASE_REF" \
            --require-authority \
            --enforce
