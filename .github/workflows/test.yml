name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # Two tiers, because the Python matrix and the toolchain setup were paying
  # for each other. Every leg installed Node, Go, go-arch-lint, .NET and Java
  # — about 50 seconds, `go install go-arch-lint` alone being 31 — and did it
  # twice, for tests whose behaviour does not vary by Python version at all.
  #
  # fast: both interpreters, no toolchains. 3.11 is the floor `requires-python`
  #       promises, and without a job on it nothing enforces the promise — a
  #       3.12-only construct would ship in a package claiming 3.11 support.
  # e2e:  one interpreter, every toolchain, paid once. These tests exercise
  #       Go, .NET, Java and Node behaviour through the shipped configs.
  #
  # The tiers are complements (`-m "not e2e"` and `-m e2e`), so nothing can
  # fall between them. As of this change: 3001 fast + 101 e2e = 3102.
  fast:
    name: pytest (fast)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[test]"

      - name: Run pytest (fast tier)
        run: pytest -m "not e2e"

  e2e:
    name: pytest (e2e + toolchains)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 3.12 only. These tests assert the behaviour of the shipped
      # import-linter, dependency-cruiser, go-arch-lint, ArchUnit and
      # ArchUnitNET configs, none of which changes with the interpreter.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      # tests/test_dependency_cruiser_reference.py runs the real
      # dependency-cruiser against generated skeletons, the way
      # test_importlinter_reference.py runs the real import-linter. Without a
      # Node toolchain those tests skip, and a skip is indistinguishable from
      # a pass in the summary — see the guard step below.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # tests/test_go_arch_lint_reference.py does the same for the shipped
      # go-arch-lint contract.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'

      - name: Install go-arch-lint
        run: go install github.com/fe3dback/go-arch-lint@latest

      # tests/test_archunitnet_template.py runs the shipped ArchUnitNET
      # template against real fixtures. Running it caught a defect no
      # structural check could: the first draft matched namespaces exactly, so
      # a violation in Api.Controllers passed silently.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      # tests/test_archunit_template.py runs the shipped ArchUnit template
      # inside a real Maven project (#109). Maven is preinstalled on
      # ubuntu-latest; this provides the JDK.
      #
      # No `cache: maven` — it keys on a pom.xml in the repository, and this
      # repo has none: the fixture generates its project in a tmp dir, which
      # is the point. Enabling it fails the job outright with "No file matched
      # to [**/pom.xml]". The only downloads are archunit-junit5 and the
      # surefire plugin, once per run.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Install
        run: pip install -e ".[test]"

      - name: Assert every reference toolchain is present
        # The reference tests skipif their toolchain is missing, which is right
        # locally but wrong here: a broken setup step would leave the only
        # tests that prove the shipped configs work silently skipped, and CI
        # would still be green.
        run: |
          set -euxo pipefail
          command -v node
          command -v npm
          command -v go
          command -v dotnet
          command -v java
          command -v mvn
          test -x "$(go env GOPATH)/bin/go-arch-lint"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run pytest (e2e tier)
        # `-rs` prints a reason for every skip, which the guard below reads.
        #
        # `set -o pipefail` is load-bearing, not housekeeping. GitHub's default
        # shell is `bash -e {0}` — no pipefail — so a bare `pytest | tee` takes
        # *tee's* exit status and a failing test reports green. In a step whose
        # whole purpose is catching silent passes, that was the silent pass.
        run: |
          set -euo pipefail
          pytest -m e2e --no-header -q -rs | tee /tmp/e2e.txt

      - name: Assert the e2e tier ran, and skipped nothing for a missing tool
        # Two failures this catches, both of which report green otherwise.
        #
        # An empty tier: rename the marker or mistype the selection and pytest
        # exits 0 having run nothing. That is the silent-skip problem the
        # toolchain assertion above guards against, one level up.
        #
        # A toolchain skip: the setup steps can succeed while a test's own
        # probe still fails to see the tool — which is precisely what happened
        # with `lint-imports`, where the console script was installed and
        # invisible, and eleven tests skipped claiming it was missing.
        #
        # An allowlist, not a blocklist of reasons. A first version matched
        # the text "not installed" — and missed the reason added in #161 for
        # the installed-but-invisible case, which reads "neither beside ... nor
        # on PATH". Enumerating the ways a skip can phrase itself is a losing
        # game: every new probe invents new wording, and the guard fails open.
        #
        # So every skip fails the build except the ones listed below, which
        # are permanent and have nothing to do with tooling. A new legitimate
        # skip needs a deliberate line here, which is the right friction for
        # removing coverage from the only tests that prove the shipped configs
        # work.
        run: |
          set -euo pipefail
          grep -Eq '[0-9]+ passed' /tmp/e2e.txt
          passed="$(grep -Eo '[0-9]+ passed' /tmp/e2e.txt | head -1 | cut -d' ' -f1)"
          echo "e2e passed: $passed"
          if [ "$passed" -lt 50 ]; then
            echo "e2e tier ran only $passed tests; it should run ~100. A marker or" >&2
            echo "selection change has emptied it." >&2
            exit 1
          fi
          # Permanent, non-toolchain skips. Anything else is a gap.
          unexpected="$(grep -E '^SKIPPED' /tmp/e2e.txt \
            | grep -v 'codex uses nested AGENTS.md' || true)"
          if [ -n "$unexpected" ]; then
            echo "An e2e test skipped that is not on the permanent allowlist." >&2
            echo "Every toolchain was asserted present above, so this is a" >&2
            echo "silent gap in the only tests proving the shipped configs" >&2
            echo "work — not a pass:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

      - name: Self-doctor smoke test (apply + doctor on a fresh tmp dir)
        # PR 4: confirms the apply → doctor flow works end-to-end against a
        # real bundled install (not just unit fixtures). Catches regressions
        # where unit tests pass but the CLI surface broke.
        #
        # Note: doctor is allowed to report warnings against the bundled
        # baseline (e.g. D007 flags known LLM-content leakage in TECH_STACK
        # that PR 6c will resolve). The smoke test asserts only that doctor
        # runs without crashing — exit code 0 or 1 is acceptable; any other
        # code is a real failure.
        run: |
          set -uxo pipefail
          tmp="$(mktemp -d)"
          govkit apply --agent claude-code --target "$tmp" \
                       --level 4 --type api --ci github --stack python-fastapi
          # Stub the hexagonal folders so D001 (rule-glob check) has matching
          # paths to resolve against — these rules assume an existing src/ layout.
          mkdir -p "$tmp"/src/{api,ports,adapters,services,security,auth}
          touch "$tmp"/src/api/.gitkeep "$tmp"/src/ports/.gitkeep \
                "$tmp"/src/adapters/.gitkeep "$tmp"/src/services/.gitkeep \
                "$tmp"/src/security/.gitkeep "$tmp"/src/auth/.gitkeep
          # Run doctor — accept exit 0 (clean) or 1 (warnings/baseline issues).
          # Exit codes >1 (e.g. 2 for argparse failure, 130 for SIGINT) fail.
          govkit doctor --target "$tmp" || rc=$?
          rc="${rc:-0}"
          if [ "$rc" -gt 1 ]; then exit "$rc"; fi
          # Stack swap exercises the overlay loader path.
          govkit stack apply dotnet-aspnet --target "$tmp"
          govkit doctor --target "$tmp" || rc=$?
          rc="${rc:-0}"
          if [ "$rc" -gt 1 ]; then exit "$rc"; fi

  wheel-smoke:
    # PR 7 / A12: build a real wheel and install it into a clean venv. The
    # pytest job uses `pip install -e .` which resolves AGENTS_DIR / STACKS_DIR
    # against the source tree; the wheel path can have entirely different
    # asset bundling (e.g. a missing force-include for cli/stacks/). This job
    # catches packaging regressions that editable installs hide.
    runs-on: ubuntu-latest
    needs: [fast, e2e]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: pip install build

      - name: Build wheel
        run: python -m build --wheel

      - name: Install wheel into a clean venv
        run: |
          set -euxo pipefail
          python -m venv /tmp/wheel-smoke-venv
          /tmp/wheel-smoke-venv/bin/pip install --upgrade pip
          /tmp/wheel-smoke-venv/bin/pip install dist/govkit-*.whl

      - name: Stack list resolves from wheel layout
        # `govkit stack list` reads cli/stacks/*/overlay.yaml — if hatch
        # didn't bundle the YAML+MD data files, this returns no stacks
        # (or crashes) inside the clean venv even though it works in dev.
        run: |
          set -euxo pipefail
          out="$(/tmp/wheel-smoke-venv/bin/govkit stack list)"
          echo "$out"
          for expected in python-fastapi dotnet-aspnet java-spring-boot nodejs-fastify go-gin python-dbt; do
            echo "$out" | grep -q "$expected" || { echo "MISSING: $expected"; exit 1; }
          done

      - name: Behavioral-baseline contract resolves from the wheel layout
        # The baseline schema and its conformance fixtures are a *shared*
        # contract: govkit-plugins and the Opportunity Engine conform against
        # these exact bytes and must not need a checkout of this repo beside
        # theirs. That only holds if governance/ actually ships at
        # cli/governance/ in the wheel, which an editable install cannot prove
        # because it reads the source tree either way.
        #
        # Runs from /tmp deliberately: at the repo root `import cli` would
        # resolve to the source directory and test nothing about the wheel.
        run: |
          set -euxo pipefail
          cd /tmp
          /tmp/wheel-smoke-venv/bin/python -c '
          import json, sys
          from cli import paths, baseline

          fixtures = paths.GOVERNANCE_DIR / "fixtures" / "behavioral-baseline"
          schema = paths.GOVERNANCE_DIR / "schemas" / "behavioral_baseline.schema.json"
          valid = fixtures / "valid" / "support-response.baseline.json"

          for required in (schema, valid):
              if not required.is_file():
                  sys.exit("MISSING FROM WHEEL: %s" % required)

          golden = (fixtures / "valid" / "support-response.digest").read_text().strip()
          digest = baseline.compute_digest(json.loads(valid.read_text(encoding="utf-8")))
          if digest != golden:
              sys.exit("DIGEST MISMATCH from wheel: %s != %s" % (digest, golden))

          invalid = list((fixtures / "invalid").glob("*.json"))
          if not invalid:
              sys.exit("MISSING FROM WHEEL: conformance fixtures under invalid/")
          print("baseline contract OK from wheel: %s, %d invalid fixtures" % (digest, len(invalid)))
          '

      - name: Declarative profiles preview and apply from the wheel
        # Runtime dependencies, bundled schemas/examples and actual CLI dispatch
        # must work without the checkout or the test extra on Python's path.
        run: |
          set -euo pipefail
          cd /tmp
          /tmp/wheel-smoke-venv/bin/python -I - <<'PY'
          import json
          import subprocess
          import sys
          import tempfile
          from pathlib import Path
          from cli import paths, profiles

          assert Path(profiles.__file__).is_relative_to(sys.prefix)
          examples = sorted((paths.GOVERNANCE_DIR / "examples/profiles").glob("*.yaml"))
          assert len(examples) >= 3
          for example in examples:
              with tempfile.TemporaryDirectory() as directory:
                  target = Path(directory)
                  command = [sys.executable, "-I", "-m", "cli.govkit", "profile"]
                  options = ["--profile", str(example), "--target", str(target), "--json"]
                  result = subprocess.run(command + ["preview"] + options, check=True, capture_output=True, text=True)
                  assert json.loads(result.stdout)["resolution"]["release_metadata_status"] == "not-queried"
                  assert list(target.iterdir()) == []
                  subprocess.run(command + ["apply"] + options, check=True, capture_output=True, text=True)
                  record_path = target / ".govkit/resolution.json"
                  record = profiles.load_resolution(record_path)
                  assert record.ready and record.profile_digest == profiles.load_profile(example).digest
                  assert not (target / ".govkit/marker.json").exists()
                  before = {p.name: (p.read_bytes(), p.stat().st_mtime_ns) for p in (target / ".govkit").iterdir()}
                  subprocess.run(command + ["apply"] + options, check=True, capture_output=True, text=True)
                  after = {p.name: (p.read_bytes(), p.stat().st_mtime_ns) for p in (target / ".govkit").iterdir()}
                  assert before == after
          print(f"Profile wheel smoke passed for {len(examples)} examples")
          PY

      - name: Capability packs and independent controls work from the wheel
        run: |
          set -euo pipefail
          cd /tmp
          /tmp/wheel-smoke-venv/bin/python -I "$GITHUB_WORKSPACE/tests/wheel_pack_smoke.py"

      - name: Check reports and explicit controls work from the wheel
        run: |
          set -euo pipefail
          cd /tmp
          /tmp/wheel-smoke-venv/bin/python -I "$GITHUB_WORKSPACE/tests/wheel_check_smoke.py"

      - name: Brownfield discovery and rediscovery work from the wheel
        run: |
          set -euo pipefail
          cd /tmp
          /tmp/wheel-smoke-venv/bin/python -I "$GITHUB_WORKSPACE/tests/wheel_discovery_smoke.py"

      - name: Apply against a fresh tmp dir from the wheel install
        # End-to-end: the wheel-installed `govkit apply` writes the marker,
        # the stack overlay docs, the editable header, and the skill_context.
        # Catches the case where docs/ assets are absent in the wheel.
        run: |
          set -euxo pipefail
          tmp="$(mktemp -d)"
          /tmp/wheel-smoke-venv/bin/govkit apply --agent claude-code \
              --target "$tmp" --level 4 --type api --ci github \
              --stack dotnet-aspnet
          test -f "$tmp/.govkit/marker.json"
          test -f "$tmp/.govkit/skill_context.yaml"
          test -f "$tmp/docs/backend/architecture/TECH_STACK.md"
          test -f "$tmp/GOVKIT_SETUP_REVIEW.md"
          grep -q "baseline: dotnet-aspnet@" "$tmp/docs/backend/architecture/TECH_STACK.md"

      - name: Apply --type data against a fresh tmp dir from the wheel install
        # The data install pulls from four distinct wheel locations
        # (cli/stacks/python-dbt/, cli/docs/data/architecture/,
        # cli/agents/claude-code/rules/data/, cli/agents/claude-code/claude-md/).
        # `stack list` only proves overlay.yaml shipped; this step proves the
        # rest of the data assets shipped too — a future packaging change that
        # silently drops any of these dirs fails here, not in production.
        run: |
          set -euxo pipefail
          tmp="$(mktemp -d)"
          /tmp/wheel-smoke-venv/bin/govkit apply --agent claude-code \
              --target "$tmp" --level 4 --type data --ci github \
              --stack python-dbt
          test -f "$tmp/.govkit/marker.json"
          test -f "$tmp/.govkit/skill_context.yaml"
          test -f "$tmp/.claude/rules/govkit/governance.md"        # claude-md/data.md
          test -f "$tmp/.claude/rules/govkit/staging.md"           # rules/data/
          test -f "$tmp/docs/data/architecture/BOUNDARIES.md"       # baseline contracts
          test -f "$tmp/docs/data/architecture/TECH_STACK.md"       # python-dbt overlay
          grep -q "baseline: python-dbt@" "$tmp/docs/data/architecture/TECH_STACK.md"

      - name: Extension list/add resolve from wheel layout
        # Extension packs ship via the extensions/ -> cli/extension_packs/
        # force-include; no other wheel-smoke step touches that mapping, so a
        # broken or dropped include would only fail here. `add` also proves
        # the skills-carrying path end-to-end from the wheel: the otter-skills
        # pack lands with its license files and installs its skills into the
        # applied agent's skills dir.
        run: |
          set -euxo pipefail
          tmp="$(mktemp -d)"
          /tmp/wheel-smoke-venv/bin/govkit apply --agent claude-code \
              --target "$tmp" --level 4 --type api --ci github \
              --stack python-fastapi
          out="$(/tmp/wheel-smoke-venv/bin/govkit extension list)"
          echo "$out"
          echo "$out" | grep -q "otter-skills"
          /tmp/wheel-smoke-venv/bin/govkit extension add otter-skills --target "$tmp"
          test -f "$tmp/extensions/otter-skills/LICENSE"
          test -f "$tmp/extensions/otter-skills/NOTICE"
          test -f "$tmp/.claude/skills/otter-unit-testing/SKILL.md"
