id: llm-evaluation
name: Llm Evaluation
version: 1.0.1
govkit_min_version: 0.21.1
extension_type: skills
contract_sets: []
skills:
- path: skills/llm-evaluation
  install_as: govkit-llm-evaluation
capability_pack:
  schema_version: 1
  provides:
  - llm-evaluation
  requires: []
  conflicts: []
  resources:
  - path: README.md
    kind: advisory
  - path: examples/results.json
    kind: example
  checks:
  - id: llm-exact-match
    path: checks/exact_match.py
    required: true
