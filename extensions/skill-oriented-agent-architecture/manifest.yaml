implementation_profiles:
  - id: agent_runtime_profile
    description: Default product bindings for the SOAA runtime responsibilities. Advisory — the runtime contract remains authoritative; deviations require an ADR.
    path: docs/backend/architecture/AGENT_RUNTIME_STACK.md
    profiles_for:
      - soaa_core
      - soaa_context_resilience
    authority: defaults
    product_selection_requires_adr: true

templates:
  - id: preflight_soaa
    path: templates/preflight-soaa.md

agent_guidance:
  architecture_preflight:
    - Read this manifest before planning any feature involving agents, skills, adaptive orchestration, tool use, delegation, memory, or agent evaluation.
    - First decide whether the feature is in SOAA's domain (governed runtime skills, an adaptive agent loop, or their control boundaries, including one agent with fixed skills). Agent count does not decide this. A touched file matching an applies_to glob only prompts that decision; it never makes SOAA applicable by itself.
    - "Keep the three layers separate: llm-application governs model use (mode: llm); SOAA governs runtime skills and agent control boundaries; agent_topology.md applies only when eval_criteria.yaml declares multi_agent: true."
    - Within the domain, load soaa_core first, then only the additional contract sets matched by feature intent and touched files.
    - Record applicability with the templates/preflight-soaa.md block in architecture_preflight.md section 15a. Select controls by behavior and consequence (docs/backend/architecture/SOAA_APPLICABILITY.md). Each omission needs a reason, a verified absent or disabled interface, an owner and a change trigger; unknown applicability stays unresolved.
    - When a material architectural assumption is untested, set the preflight outcome to experiment-required and plan the smallest experiment from docs/backend/architecture/SOAA_EXPERIMENTS.md. Do not label an unproven design aligned to start a contained prototype.
    - Read AGENT_RUNTIME_STACK.md for default runtime product bindings, but treat it as advisory — the runtime contract wins on any conflict, and deviating from a default requires an ADR.
    - Classify every relevant component as agent run, skill, tool, resource, workflow, policy, evaluator, memory, or trusted controller.
    - Record the accountable principal, accepted task boundary, single runtime owner, authoritative state writers, external side effects, approval routes, and completion evidence. Map logical roles and writers once at system level and review only the changed rows per feature.
    - List every applicable SOAA contract in architecture_preflight.md.
    - Require an ADR for an extension, override, or violation of these contracts.
  implementation_plan:
    - Separate adaptive model proposals from deterministic validation and commit paths.
    - Map every authoritative aggregate to one trusted writer, typed port, persistence boundary, and verification family.
    - Bind each activation to one exact admitted skill release, authority envelope, context snapshot, dependency lock, and evidence profile.
    - Give every mutating external operation a durable identity, fresh authorization, idempotency rule, reconciliation route, and evidence record.
    - Include negative, fault-injection, concurrency, recovery, evaluation, and evidence tests for every affected control boundary.
  validation:
    - Validate every declared contract path after extension installation.
    - Reject direct model writes to authoritative state, direct skill grants, hidden skill activation, and task completion based only on skill or model success.
    - Verify one active task owner, deterministic admission before ranking, atomic activation, fresh operation authorization, bounded execution, and an independent completion gate.
    - Treat missing, stale, conflicting, or invalid evidence as a blocked or inconclusive gate, never implicit success.
