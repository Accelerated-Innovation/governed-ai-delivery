id: skill-oriented-agent-architecture
name: Skill-Oriented Agent Architecture Extension
version: 0.2.0
description: Adds provider-neutral architecture contracts for governed applications in which accountable agent runs select and apply versioned procedural skills inside deterministic control boundaries.
govkit_min_version: 0.21.1
extension_type: architecture
supported_levels:
  - 5
supported_project_types:
  - api
  - cli

capability_pack:
  schema_version: 1
  provides:
    - skill-oriented-agent-architecture
    - governed-agent-runtime
    - procedural-skills
    - task-ownership
    - deterministic-control-boundary
    - provider-neutral-agent-architecture
    - deterministic-skill-admission
    - skill-ranking
    - atomic-skill-activation
    - effective-authority
    - scoped-approval
    - revocation
    - instruction-precedence
    - progressive-context
    - context-snapshots
    - resource-trust
    - governed-memory
    - bounded-retry
    - reconciliation
    - compensation
    - execution-budgets
    - agent-evaluation
    - skill-admission-evaluation
    - completion-gates
    - durable-evidence
    - conformance-claims
    - governed-skill-lifecycle
    - exact-release-binding
    - skill-supply-chain
    - agent-skills-profile
    - mcp-mapping
    - a2a-mapping
    - runtime-portability
  requires: []
  conflicts: []
  agents:
    - claude-code
    - codex
    - copilot
  resources:
    - path: docs/backend/architecture/SKILL_ORIENTED_AGENT_ARCHITECTURE.md
      kind: contract
    - path: docs/backend/architecture/SKILL_CONTRACT.md
      kind: contract
    - path: docs/backend/architecture/RUNTIME_STATE_AND_EXECUTION_CONTRACT.md
      kind: contract
    - path: docs/backend/architecture/SKILL_SELECTION_AND_ACTIVATION_CONTRACT.md
      kind: contract
    - path: docs/backend/architecture/AUTHORITY_AND_APPROVAL_CONTRACT.md
      kind: contract
    - path: docs/backend/architecture/CONTEXT_MEMORY_AND_RESOURCE_CONTRACT.md
      kind: contract
    - path: docs/backend/architecture/RESILIENCE_AND_RECOVERY_CONTRACT.md
      kind: contract
    - path: docs/backend/architecture/EVALUATION_EVIDENCE_AND_COMPLETION_CONTRACT.md
      kind: contract
    - path: docs/backend/architecture/SKILL_LIFECYCLE_AND_INTEROPERABILITY_CONTRACT.md
      kind: contract
    - path: docs/backend/architecture/AGENT_RUNTIME_STACK.md
      kind: defaults
    - path: README.md
      kind: advisory
    - path: docs/backend/architecture/SOAA_APPLICABILITY.md
      kind: advisory
    - path: docs/backend/architecture/SOAA_EXPERIMENTS.md
      kind: advisory
    - path: templates/preflight-soaa.md
