# Generated by GovKit; configure a trusted caller before activation.
parameters:
- name: python
  type: string
- name: target
  type: string
- name: policy_target
  type: string
- name: request
  type: string
- name: base
  type: string
- name: pack_arguments
  type: string
  default: ''
- name: observed_at
  type: string
  default: ''
- name: provider_event
  type: string
- name: policy_revision
  type: string
- name: request_digest
  type: string
- name: change_output
  type: string
  default: ''
steps:
- bash: |
    case "$GOVKIT_PYTHON" in
      /*) ;;
      *) printf '%s\n' 'GOVKIT_PYTHON must be an absolute path' >&2; exit 1 ;;
    esac
    exec -- "$GOVKIT_PYTHON" -I -m cli.pipeline_runtime
  displayName: GovKit change conformance
  env:
    GOVKIT_BINDING: 
    GOVKIT_PYTHON: ${{ parameters.python }}
    GOVKIT_TARGET: ${{ parameters.target }}
    GOVKIT_POLICY_TARGET: ${{ parameters.policy_target }}
    GOVKIT_REQUEST: ${{ parameters.request }}
    GOVKIT_BASE: ${{ parameters.base }}
    GOVKIT_PACK_ARGUMENTS: ${{ parameters.pack_arguments }}
    GOVKIT_OBSERVED_AT: ${{ parameters.observed_at }}
    GOVKIT_PROVIDER_EVENT: ${{ parameters.provider_event }}
    GOVKIT_POLICY_REVISION: ${{ parameters.policy_revision }}
    GOVKIT_REQUEST_DIGEST: ${{ parameters.request_digest }}
    GOVKIT_CHANGE_OUTPUT: ${{ parameters.change_output }}
