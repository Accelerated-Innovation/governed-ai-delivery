[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "govkit"
version = "0.21.1"
description = "Governed AI delivery kit — spec-driven scaffolding for AI coding agents"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
  { name = "Accelerated Innovation", email = "marty@acceleratedinnovation.com" }
]
keywords = [
  "ai", "governance", "scaffolding", "copilot", "claude-code", "specification",
  "spec-driven-development", "ai-agents", "llm", "genai", "agentic",
  "coding-assistant", "cursor", "gherkin", "bdd", "developer-experience",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Environment :: Console",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing :: BDD",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"

dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.0,<5",
    "packaging>=24,<27",
]

[project.optional-dependencies]
# Baseline validation parses Gherkin with the Cucumber team's own parser.
# Optional rather than a runtime dependency: the installer's whole runtime
# surface validates profiles with PyYAML/jsonschema; only `govkit validate --baseline` needs this. It is
# not a soft dependency in behaviour — cli/spec_closure.py raises
# ParserUnavailable rather than falling back to a shallow parse, which would
# mis-compute the closure and answer confidently with the wrong verdict.
baseline = [
    "gherkin-official>=32,<43",
]
test = [
    "pytest>=8.0",
    # The baseline tests parse real Gherkin; without this they do not skip,
    # they raise ParserUnavailable and turn CI red on a clean checkout.
    "gherkin-official>=32,<43",
    # tests/test_importlinter_reference.py runs the real linter against the
    # contract govkit ships, so it cannot drift from BOUNDARIES.md.
    "import-linter>=2.0",
]

[project.urls]
Homepage = "https://github.com/Accelerated-Innovation/governed-ai-delivery"
Repository = "https://github.com/Accelerated-Innovation/governed-ai-delivery"
Issues = "https://github.com/Accelerated-Innovation/governed-ai-delivery/issues"

[project.scripts]
govkit = "cli.govkit:main"

[tool.hatch.build.targets.wheel]
packages = ["cli"]

[tool.hatch.build.targets.wheel.force-include]
"agents" = "cli/agents"
"docs" = "cli/docs"
"features" = "cli/features"
"governance" = "cli/governance"
"ci" = "cli/ci"
# Compact private asset root keeps deep Windows venv installs below MAX_PATH.
# NOT cli/extensions: that is the discovery module cli/extensions.py.
# Public pack IDs and installed paths stay unchanged; use paths.EXTENSION_PACKS_DIR.
"extensions" = "cli/ext"
# Note: cli/stacks/ is inside the cli package and ships automatically with
# the wheel. An earlier `"cli/stacks" = "cli/stacks"` force-include here
# caused hatch to bundle the directory twice (producing zipfile duplicate
# warnings); the entry was removed in PR 7 once we confirmed the wheel
# still contains the overlay YAML/MD files.

[tool.ruff]
line-length = 100
target-version = "py312"

select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "B",   # bugbear
    "I",   # import sorting
]

ignore = [
    "E501" # line length handled by formatter
]

fix = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = [
    "tests"
]

python_files = [
    "test_*.py"
]

addopts = "-ra --strict-markers"

markers = [
    "unit: unit tests",
    "bdd: BDD integration tests",
    "contract: contract tests",
    "e2e: full-install end-to-end tests (apply/doctor/calibrate cycles over real bundle trees); excluded from the fast loop via -m 'not e2e'",
]

# The import-linter reference template for adopting projects lives — as a
# single, tested copy — in governance/backend/importlinter-reference.toml.
# It is deliberately not duplicated here: govkit's own source is `cli/`, not
# `src/`, so a contract in this file would never run and would only drift.
